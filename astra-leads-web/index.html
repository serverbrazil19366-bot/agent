<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra Leads</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astra Leads">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#f5f6fa; --ink:#0f172a; --mute:#64748b; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --ink:#e5e7eb; --mute:#94a3b8; --accent:#818cf8; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .center { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; gap:8px; }
  .center img { width:56px; height:56px; border-radius:14px; }
  .center p { color:var(--mute); max-width:420px; margin:0; }
  .spin { width:28px; height:28px; border:3px solid rgba(127,127,127,.25); border-top-color:var(--accent); border-radius:50%; animation:s 0.8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  button { margin-top:8px; border:0; background:var(--accent); color:#fff; border-radius:10px; padding:10px 16px; font:inherit; }
</style>
</head>
<body>
<div class="center" id="msg"><img src="icon-192.png" alt=""><div class="spin"></div><p>Loading your leads…</p></div>
<script>
// Astra Leads: opens the dashboard from your Apps Script without going to script.google.com,
// so it works in any browser, even one signed into several Google accounts.
(function () {
  // Your Apps Script web app (Deploy → Manage deployments → Web app URL, ends in /exec)
  var WEB_APP_URL = 'PASTE_WEB_APP_URL_HERE';

  var KEY = 'astra-leads-key';
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  window.addEventListener('hashchange', function () { if (/k=/.test(location.hash)) location.reload(); });
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) { set(h.get('k')); history.replaceState(null, '', location.pathname + location.search); }
  var key = get() || h.get('k');
  var msg = document.getElementById('msg');
  function fail(title, text) {
    msg.innerHTML = '<img src="icon-192.png" alt=""><h2 style="margin:8px 0 0">' + title + '</h2><p>' + text + '</p>' +
      '<button onclick="location.reload()">Try again</button>';
  }
  if (!key) { fail('Open your private link once', 'Open the link that ends in <b>#k=…</b> on this device. After that, this page remembers it.'); return; }

  var q = new URLSearchParams(location.search);
  var view = q.get('view') || (Math.min(screen.width, innerWidth) < 760 ? 'mobile' : 'desktop');

  // Stand-in for google.script.run: the dashboard's buttons call the script through POST.
  function runner(ok, bad) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return runner(f, bad); };
      if (fn === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ t: key, fn: fn, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j.error) throw new Error(j.error); if (ok) ok(j.result); })
          .catch(function (e) { if (bad) bad(e); else alert(e.message); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null) } };

  fetch(WEB_APP_URL + '?api=page&view=' + view + '&t=' + encodeURIComponent(key))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) { fail('Not connected', j.error + '. Open your private link again.'); return; }
      document.open(); document.write(j.html); document.close();
    })
    .catch(function (e) { fail('Could not load', 'Check your internet connection. (' + e.message + ')'); });
})();
</script>
</body>
</html>
