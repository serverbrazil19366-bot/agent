<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Sathya Klassy Fashion</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff7fa">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="wrap" id="app">
  <div class="page-head">
    <div class="crumbs"><a href="/">Home</a> / Checkout</div>
    <h1>Checkout</h1>
    <p>Fill your address, then pay by UPI. Your order is placed the moment your payment reaches us.</p>
  </div>
  <form class="co" id="form" novalidate>
    <div class="form-card">
      <h2>Delivery address</h2>
      <div class="fields">
        <label class="f">Full name<input id="f-name" name="name" autocomplete="name" required maxlength="80"></label>
        <label class="f">Mobile number <small>for WhatsApp updates</small><input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required maxlength="14" placeholder="10-digit number"></label>
        <label class="f full">Address <small>house no, street, area, landmark</small><textarea id="f-address" name="address" autocomplete="street-address" required maxlength="400"></textarea></label>
        <label class="f">City<input id="f-city" name="city" autocomplete="address-level2" required maxlength="60"></label>
        <label class="f">Pincode<input id="f-pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" required maxlength="6"></label>
        <label class="f full">State<select id="state" name="state" autocomplete="address-level1" required></select></label>
        <label class="f full">Gift note or instructions <small>optional</small><textarea id="f-note" name="note" maxlength="300" placeholder="Eg. Happy Birthday Priya! or deliver after 5 pm"></textarea></label>
        <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      </div>
    </div>
    <aside class="co-side">
      <div class="form-card">
        <h2>Your order</h2>
        <div id="summary"><div class="skeleton" style="height:140px"></div></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-pink btn-block" id="place" type="submit">Continue to pay</button>
      <p class="secure-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> You pay in your own UPI app. We never ask for your UPI PIN, OTP or bank details.</p>
    </aside>
  </form>
</main>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/fx.js"></script>
<script src="/js/common.js"></script>
<script src="/js/pages/checkout.js"></script>
</body>
</html>
