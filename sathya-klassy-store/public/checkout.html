<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Sathya Klassy Fashion</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff7fa">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="wrap" id="app">
  <div class="page-head">
    <div class="crumbs"><a href="/">Home</a> / Checkout</div>
    <h1>Checkout</h1>
    <p>Fill your address, pay by UPI and enter the transaction ID. That's it!</p>
  </div>
  <form class="co" id="form" novalidate>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="form-card">
        <h2>1. Delivery address</h2>
        <div class="fields">
          <label class="f">Full name<input name="name" autocomplete="name" required maxlength="80"></label>
          <label class="f">Mobile number <small>for WhatsApp updates</small><input name="phone" type="tel" inputmode="numeric" autocomplete="tel" required maxlength="14" placeholder="10-digit number"></label>
          <label class="f full">Address <small>house no, street, area, landmark</small><textarea name="address" autocomplete="street-address" required maxlength="400"></textarea></label>
          <label class="f">City<input name="city" autocomplete="address-level2" required maxlength="60"></label>
          <label class="f">Pincode<input name="pincode" inputmode="numeric" autocomplete="postal-code" required maxlength="6"></label>
          <label class="f full">State<select name="state" id="state" autocomplete="address-level1" required></select></label>
          <label class="f full">Gift note or instructions <small>optional</small><textarea name="note" maxlength="300" placeholder="Eg. Happy Birthday Priya! 💗 or deliver after 5 pm"></textarea></label>
          <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
        </div>
      </div>
      <div class="form-card" id="pay-card">
        <h2>2. Pay by UPI</h2>
        <div id="pay"></div>
      </div>
    </div>
    <aside class="co-side">
      <div class="form-card">
        <h2>Your order</h2>
        <div id="summary"><div class="skeleton" style="height:140px"></div></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-pink btn-block" id="place" type="submit">Place order</button>
      <p style="font-size:12.5px;color:var(--muted);margin:0;text-align:center">We check every payment by hand and confirm your order on WhatsApp, usually within a few hours.</p>
    </aside>
  </form>
</main>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const { $, esc, inr, icons, api, shop, cart, cartLines, shippingFor, thumb, waLink } = SK;
  const STATES = ['Andaman and Nicobar Islands','Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chandigarh','Chhattisgarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Goa','Gujarat','Haryana','Himachal Pradesh','Jammu and Kashmir','Jharkhand','Karnataka','Kerala','Ladakh','Lakshadweep','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Puducherry','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'];
  $('#state').innerHTML = '<option value="">Choose state</option>' + STATES.map((s) => `<option${s === 'Tamil Nadu' ? ' selected' : ''}>${s}</option>`).join('');

  // remember the address on this phone for next time
  const form = $('#form');
  try {
    const saved = JSON.parse(localStorage.getItem('sk-address') || 'null');
    if (saved) for (const k of ['name', 'phone', 'address', 'city', 'pincode', 'state']) if (saved[k]) form.elements[k].value = saved[k];
  } catch {}

  let total = 0, lines = [], settings;
  async function render() {
    const [{ lines: l, subtotal }, s] = await Promise.all([cartLines(), shop()]);
    lines = l; settings = s.settings;
    if (!lines.length) {
      $('#app').innerHTML = `<div class="empty" style="padding:80px 10px">${icons.bag}<h1 style="font-family:var(--serif)">Your cart is empty</h1><p>Add something cute first!</p><a class="btn btn-pink" href="/shop">Go to shop</a></div>`;
      return false;
    }
    const ship = shippingFor(subtotal, settings);
    total = subtotal + ship;
    $('#summary').innerHTML = lines.map((x) => `
      <div class="line" style="grid-template-columns:56px 1fr auto">${thumb(x.p)}<div><b>${esc(x.p.name)}</b><small>${x.qty} × ${inr(x.p.price)}</small></div><b>${inr(x.p.price * x.qty)}</b></div>`).join('') + `
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px">
        <div class="totals"><span>Subtotal</span><span>${inr(subtotal)}</span></div>
        <div class="totals"><span>Shipping</span><span>${ship ? inr(ship) : 'Free'}</span></div>
        <div class="totals grand"><span>Total to pay</span><span>${inr(total)}</span></div>
        ${ship ? `<small style="color:var(--muted)">Add ${inr(settings.freeShippingAbove - subtotal)} more for free shipping. <a href="/shop">Shop more</a></small>` : ''}
      </div>`;
    renderPay();
    return true;
  }

  function renderPay() {
    if (!settings.upiId) {
      $('#pay').innerHTML = `<p class="notice warn">Online payment is being set up. Please send your order on WhatsApp and we'll share payment details.</p>
        ${settings.whatsapp ? `<a class="btn btn-wa btn-block" style="margin-top:12px" target="_blank" rel="noopener" href="${waLink(settings.whatsapp, 'Hi! I want to order:\n' + lines.map((x) => `• ${x.p.name} × ${x.qty}`).join('\n') + '\nTotal: ' + inr(total))}">${icons.wa} Order on WhatsApp</a>` : ''}`;
      $('#place').disabled = true;
      return;
    }
    const upi = `upi://pay?pa=${encodeURIComponent(settings.upiId)}&pn=${encodeURIComponent(settings.upiName || settings.shopName)}&am=${total}.00&cu=INR&tn=${encodeURIComponent('Sathya Klassy order')}`;
    let qrSvg = '';
    try { const qr = qrcode(0, 'M'); qr.addData(upi); qr.make(); qrSvg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch {}
    const mobile = matchMedia('(pointer: coarse)').matches;
    $('#pay').innerHTML = `
      <div class="upi">
        <div class="qr" role="img" aria-label="UPI QR code to pay ${inr(total)}">${qrSvg}</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="color:var(--muted);font-size:13px">Amount to pay</span>
          <span class="amount-big">${inr(total)}</span>
          <span style="color:var(--muted);font-size:13px">UPI ID</span>
          <span class="upi-id">${esc(settings.upiId)} <button type="button" class="remove" id="copy-upi">Copy</button></span>
          <span style="font-size:13px;color:var(--muted)">Scan with GPay, PhonePe, Paytm or any UPI app.</span>
        </div>
      </div>
      ${mobile ? `<a class="btn btn-gold btn-block" style="margin-top:16px" href="${upi}">${icons.upi} Pay ${inr(total)} with UPI app</a>` : ''}
      <label class="f" style="margin-top:18px">UPI transaction ID (UTR) <small>12-digit number shown after payment in your UPI app</small>
        <input name="utr" inputmode="numeric" autocomplete="off" required maxlength="22" placeholder="Eg. 412345678901"></label>`;
    $('#copy-upi').onclick = async () => { try { await navigator.clipboard.writeText(settings.upiId); SK.toast('UPI ID copied'); } catch {} };
  }

  if (!(await render())) return;
  document.addEventListener('cart:change', render);

  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const err = $('#err');
    err.textContent = '';
    const phone = String(f.phone).replace(/\D/g, '').slice(-10);
    const problems = [];
    if (!f.name.trim()) problems.push('your name');
    if (!/^[6-9]\d{9}$/.test(phone)) problems.push('a valid 10-digit mobile number');
    if (!f.address.trim() || !f.city.trim() || !f.state) problems.push('your full address');
    if (!/^[1-9]\d{5}$/.test(f.pincode)) problems.push('a 6-digit pincode');
    if (!/^[A-Za-z0-9]{10,22}$/.test(String(f.utr || '').replace(/\s/g, ''))) problems.push('the UPI transaction ID after paying');
    if (problems.length) { err.textContent = 'Please enter ' + problems.join(', ') + '.'; return; }
    const btn = $('#place');
    btn.disabled = true; btn.textContent = 'Placing your order…';
    try {
      const { order } = await api('orders', {
        method: 'POST',
        body: JSON.stringify({
          customer: { name: f.name, phone, address: f.address, city: f.city, state: f.state, pincode: f.pincode },
          note: f.note, utr: f.utr, website: f.website, expectedTotal: total,
          items: lines.map((x) => ({ id: x.id, qty: x.qty })),
        }),
      });
      try { localStorage.setItem('sk-address', JSON.stringify({ name: f.name, phone, address: f.address, city: f.city, state: f.state, pincode: f.pincode })); localStorage.setItem('sk-last-order', JSON.stringify({ id: order.id, phone })); } catch {}
      document.removeEventListener('cart:change', render);
      cart.clear();
      const msg = `Hi Sathya Klassy! 💗 I placed an order.\nOrder ID: ${order.id}\nTotal paid: ${inr(order.total)}\nUPI transaction ID: ${f.utr}\nName: ${f.name}`;
      $('#app').innerHTML = `
        <div class="success">
          <div class="tick">${icons.check}</div>
          <h1>Thank you, ${esc(order.name)}!</h1>
          <p>Your order is placed. We'll check your payment and confirm on WhatsApp.</p>
          <div class="order-id">${esc(order.id)}</div>
          <p style="color:var(--muted);font-size:14px">Save this order ID to track your order.</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px">
            ${settings.whatsapp ? `<a class="btn btn-wa" target="_blank" rel="noopener" href="${waLink(settings.whatsapp, msg)}">${icons.wa} Send order on WhatsApp</a>` : ''}
            <a class="btn btn-ghost" href="/track?id=${encodeURIComponent(order.id)}&phone=${phone}">Track order</a>
          </div>
        </div>`;
      scrollTo({ top: 0 });
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false; btn.textContent = 'Place order';
    }
  };
})();
</script>
</body>
</html>
