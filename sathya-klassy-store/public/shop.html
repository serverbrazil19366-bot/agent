<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All · Sathya Klassy Fashion</title>
<meta name="description" content="Shop cute hair clips, jewellery, chocolate bouquets, combos and gift hampers online. Pay by UPI, shipped all over India.">
<meta name="theme-color" content="#fff7fa">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon-192.png">
<meta property="og:image" content="/assets/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div class="crumbs"><a href="/">Home</a> / Shop</div>
    <h1 id="title">Shop <span class="script" style="color:var(--pink-600)">all</span></h1>
    <p id="subtitle">Cute, trendy and affordable. New drops every week.</p>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  <div class="toolbar" style="margin-bottom:22px">
    <label class="search"><span class="sr-only">Search products</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search clips, hampers, chains…" autocomplete="off"></label>
    <label><span class="sr-only">Sort</span>
      <select class="sort" id="sort">
        <option value="featured">Featured</option><option value="new">Newest</option>
        <option value="low">Price: low to high</option><option value="high">Price: high to low</option>
      </select></label>
  </div>
  <p id="count" class="sr-only" aria-live="polite"></p>
  <div class="grid" id="grid">
    <div class="skeleton" style="height:360px"></div><div class="skeleton" style="height:360px"></div><div class="skeleton" style="height:360px"></div><div class="skeleton" style="height:360px"></div>
  </div>
</main>
<script src="/js/fx.js"></script>
<script src="/js/common.js"></script>
<script src="/js/pages/shop.js"></script>
</body>
</html>
