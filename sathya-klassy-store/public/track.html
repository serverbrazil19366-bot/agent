<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Your Order · Sathya Klassy Fashion</title>
<meta name="description" content="Track your Sathya Klassy Fashion order with your order ID and mobile number.">
<meta name="theme-color" content="#fff7fa">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="wrap" style="max-width:720px">
  <div class="page-head">
    <div class="crumbs"><a href="/">Home</a> / Track order</div>
    <h1>Track your <span class="script" style="color:var(--pink-600)">order</span></h1>
    <p>Enter the order ID we gave you and your mobile number.</p>
  </div>
  <form class="form-card" id="form" style="margin:20px 0">
    <div class="fields">
      <label class="f">Order ID<input name="id" required placeholder="SK2611161234" autocapitalize="characters" maxlength="14"></label>
      <label class="f">Mobile number<input name="phone" type="tel" inputmode="numeric" required maxlength="14" placeholder="10-digit number"></label>
    </div>
    <p class="err" id="err" role="alert" style="margin-top:12px"></p>
    <button class="btn btn-pink" type="submit" style="margin-top:6px">Track order</button>
  </form>
  <div id="result" aria-live="polite"></div>
</main>
<script src="/js/fx.js"></script>
<script src="/js/common.js"></script>
<script src="/js/pages/track.js"></script>
</body>
</html>
