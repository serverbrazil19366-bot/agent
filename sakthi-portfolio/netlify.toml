# Static site: no build step, Netlify serves this folder as is.
# Source and build scripts live in serverbrazil19366-bot/agent (sakthi-portfolio/).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/insights/whatsapp-booking-automation-n8n.html"
  to = "/insights/dental-lab-case-portal-automation.html"
  status = 301
