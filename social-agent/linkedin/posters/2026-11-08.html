<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { background: radial-gradient(80% 55% at 50% 78%, #1a3fb8 0%, #0a1550 45%, #050a24 100%); color: #fff; text-align: center; }
.glow { position: absolute; left: 90px; right: 90px; bottom: 150px; height: 440px; background: radial-gradient(closest-side, rgba(255,190,90,.38), rgba(255,190,90,0)); }
.logo { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); height: 64px; opacity: .95; }
.k { position: absolute; top: 180px; left: 0; right: 0; font-size: 22px; letter-spacing: .34em; text-transform: uppercase; color: #ffd27a; font-weight: 600; }
h1 { position: absolute; top: 270px; left: 60px; right: 60px; font-family: Serif; font-weight: 800; font-size: 150px; line-height: .98; letter-spacing: -.02em; }
h1 em { font-style: normal; color: #ffc65c; display: block; }
p { position: absolute; top: 640px; left: 140px; right: 140px; font-size: 32px; line-height: 1.45; color: #dfe6ff; }
.row { position: absolute; left: 0; right: 0; bottom: 250px; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
.row img { width: 150px; }
.row img:nth-child(2), .row img:nth-child(4) { width: 120px; }
.row img:nth-child(1), .row img:nth-child(5) { width: 95px; }
.sign { color: #c9d3f5; justify-content: center; gap: 24px; }
</style></head><body>
<div class="k">Wishing you and your family</div>
<h1>Happy <em>Deepavali</em></h1>
<p>Growth rarely comes from one big moment. It comes from small things done well, again and again.</p>
<div class="glow"></div>
<div class="row"><img src="diya.svg"><img src="diya.svg"><img src="diya.svg"><img src="diya.svg"><img src="diya.svg"></div>
<div class="sign"><span>— <b>Sakthi</b></span></div>
</body></html>
